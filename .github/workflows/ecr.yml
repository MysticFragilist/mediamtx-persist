# Fork-specific workflow: builds images and pushes them to Amazon ECR Public.
# Kept separate from release.yml so that upstream changes can be merged without conflicts.
name: ecr

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ecr:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - run: make binaries

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - run: make ecr
